name: Deploy wedding invitation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wedding/**'
      - '.github/workflows/deploy-wedding.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un run en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the wedding site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wedding

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
